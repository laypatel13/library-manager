[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lay-library-manager"
version = "0.1.1"
description = "A colorful CLI library manager for tracking books and reading progress"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

authors = [
{name = "Lay Patel", email = "lay.patel.1313@gmail.com"}
]

keywords = [
"cli",
"library",
"books",
"reading",
"manager"
]

classifiers = [
"Programming Language :: Python :: 3",
"License :: OSI Approved :: MIT License",
"Operating System :: OS Independent",
"Environment :: Console",
]

dependencies = [
"colorama==0.4.6",
"tabulate>=0.9.0",
]

[project.scripts]
library-manager = "library_manager.main:main"

[project.urls]
Homepage = "https://github.com/laypatel13/library-manager"
